name: 构建 QQBot-cli

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: qqbot-cli
            artifact: qqbot-cli-ubuntu-x86_64
            rustflags: ""
          - platform: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: qqbot-cli.exe
            artifact: qqbot-cli-windows-x86_64.exe
            rustflags: "-C target-feature=+crt-static"
          - platform: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            executable: qqbot-cli
            artifact: qqbot-cli-macos-aarch64
            rustflags: ""
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 安装 Rust 工具链
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target "${{ matrix.target }}"
          rustup default stable
          rustc -Vv | sed -n 's/^commit-hash: /commit=/p' >> "$GITHUB_OUTPUT"

      - name: 安装 musl 工具
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: 缓存 Cargo 依赖和构建文件
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ steps.toolchain.outputs.commit }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: 检查代码格式
        run: cargo fmt --all -- --check

      - name: 编译发布版可执行程序
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: 验证命令行入口
        run: |
          binary="./target/${{ matrix.target }}/release/${{ matrix.executable }}"
          "$binary" --version
          "$binary" --help
          "$binary" register --help
          "$binary" send text --help
          "$binary" send file --help

      - name: 整理可执行程序
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.artifact }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: 下载全部平台构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: qqbot-cli-*
          path: dist
          merge-multiple: true

      - name: 创建 Release 并上传单文件程序
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "无效的版本 tag：$TAG" >&2
            exit 1
          fi
          assets=(
            dist/qqbot-cli-ubuntu-x86_64
            dist/qqbot-cli-windows-x86_64.exe
            dist/qqbot-cli-macos-aarch64
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 支持重跑工作流，替换同名附件而非重复创建 Release。
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
